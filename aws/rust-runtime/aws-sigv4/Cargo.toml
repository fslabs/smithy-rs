[package]
name = "aws-sigv4"
version = "1.6.0"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>", "David Barsky <me@davidbarsky.com>"]
description = "SigV4 signer for HTTP requests and Event Stream messages."
edition = "2021"
exclude = ["aws-sig-v4-test-suite/*"]
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

[features]
default = ["sign-http", "http1"]
http0-compat = ["dep:http0"]
http1 = ["dep:http"]
# NOTE: this deliberately does not enable `dep:http0`. Signing runs on `http` 1.x via
# `SigningInstructions::apply_to_request_http1x`; the only code needing `http` 0.2.x is
# `apply_to_request_http0x`, which is gated on `http0-compat` below.
sign-http = ["dep:percent-encoding", "dep:form_urlencoded"]
sign-eventstream = ["dep:aws-smithy-eventstream"]
sigv4a = ["dep:p256", "dep:crypto-bigint", "dep:subtle", "dep:zeroize"]
# Compute SigV4 SHA-256 and HMAC-SHA256 with AWS-LC instead of RustCrypto.
aws-lc-rs = ["dep:aws-lc-rs", "aws-lc-rs?/aws-lc-sys"]
# As `aws-lc-rs`, using the AWS-LC FIPS module. SigV4a still uses RustCrypto.
# `?/` keeps this from also enabling the `aws-lc-rs` feature and its non-FIPS build.
aws-lc-rs-fips = ["dep:aws-lc-rs", "aws-lc-rs?/fips"]

[dependencies]
# fslabs: registry versions from the published aws-sigv4 1.6.0, so that patching
# this crate from git does not also pull these crates from git.
aws-credential-types = "1.3.0"
aws-smithy-eventstream = { version = "0.61.4", optional = true }
aws-smithy-http = "0.64.0"
aws-smithy-runtime-api = { version = "1.17.0", features = ["client"] }
aws-smithy-types = "1.8.0"
aws-lc-rs = { version = "1", default-features = false, optional = true }
bytes = "1.11.1"
form_urlencoded = { version = "1.2.1", optional = true }
hex = "0.4.3"
hmac = "0.13"
http0 = { package = "http" , version = "0.2.12", optional = true }
http = { version = "1.3.1", optional = true }
p256 = { version = "0.13.2", features = ["ecdsa"], optional = true }
percent-encoding = { version = "2.3.1", optional = true }
sha2 = "0.11"
crypto-bigint = { version = "0.5.4", optional = true }
subtle = { version = "2.5.0", optional = true }
# 0.3.35 is the minimum version that compiles on Rust 1.80+ (earlier versions hit a type inference bug)
time = "0.3.35"
tracing = "0.1.44"
zeroize = { version = "^1.7.0", optional = true }

[dev-dependencies]
aws-credential-types = { version = "1.3.0", features = ["test-util", "hardcoded-credentials"] }
aws-smithy-runtime-api = { version = "1.17.0", features = ["client", "test-util"] }
bytes = "1.11.1"
hex-literal = "0.4.1"
httparse = "1.10.1"
pretty_assertions = "1.3"
proptest = "1.2"
serde = "1.0.180"
serde_derive = "1.0.180"
serde_json = "1.0.104"
time = { version = "0.3.5", features = ["parsing"] }

criterion = "0.5"

[[bench]]
name = "hmac"
harness = false

[[bench]]
name = "sigv4a"
harness = false
required-features = ["sigv4a"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata

[package.metadata.smithy-rs-release-tooling]
stable = true
